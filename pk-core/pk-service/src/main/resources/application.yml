# Cấu hình chung. Bí mật (DB, khoá JWT) lấy từ biến môi trường, KHÔNG commit giá trị thật.
spring:
  application:
    name: pk-core
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pk_core}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: ${PORT:8080}
  shutdown: graceful

app:
  ai:
    enabled: ${AI_ENABLED:false}
    provider: ${AI_PROVIDER:gemini}
    api-key: ${AI_API_KEY:}
    base-url: ${AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
    model: ${AI_MODEL:gemini-2.0-flash}
    timeout: ${AI_TIMEOUT:3s}
    max-candidates: ${AI_MAX_CANDIDATES:24}
    min-recommendations: ${AI_MIN_RECOMMENDATIONS:3}
    max-recommendations: ${AI_MAX_RECOMMENDATIONS:6}
    min-set-items: ${AI_MIN_SET_ITEMS:2}
    max-set-items: ${AI_MAX_SET_ITEMS:6}
    history-limit: ${AI_HISTORY_LIMIT:20}
    budget-tolerance-ratio: ${AI_BUDGET_TOLERANCE_RATIO:0.10}
    max-concurrent-calls: ${AI_MAX_CONCURRENT_CALLS:2}
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:1024}
    max-input-chars: ${AI_MAX_INPUT_CHARS:6000}
  mirage:
    dialect: ${MIRAGE_DIALECT:postgresql}   # postgresql | h2 (test)
  jwt:
    issuer: pk-core
    access-token-minutes: 15
    refresh-token-days: 14
    # PEM (PKCS#8 private / X.509 public). Để trống => khoá tạm chỉ dùng dev. Xem README để sinh khoá.
    private-key: ${JWT_PRIVATE_KEY:}
    public-key: ${JWT_PUBLIC_KEY:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:6100,http://localhost:3100,https://jewelry-ecommerce-client.vercel.app}
  seed:
    enabled: ${SEED_ENABLED:false}
  upload:
    # Thư mục lưu file upload tạm (mặc định ổ D). public-base-url: tiền tố tuyệt đối trả cho FE, vd http://localhost:8080
    # Một thư mục gốc cho mọi file, tách folder: images/, videos/ (công khai) và private/import-export/ (CSV, KHÔNG công khai).
    # Trên cloud nên trỏ UPLOAD_DIR vào ổ bền (persistent disk); ổ tạm thì file mất khi máy dựng lại (ảnh) hoặc phải xuất lại (CSV).
    dir: ${UPLOAD_DIR:D:/pk-uploads}
    public-base-url: ${UPLOAD_PUBLIC_BASE_URL:}
    # Khoá ký link tải CSV (HMAC). Để trống = khoá ngẫu nhiên mỗi lần khởi động (link cũ hết hiệu lực khi restart). Không đặt giá trị thật vào git.
    signing-secret: ${UPLOAD_SIGNING_SECRET:}
    link-ttl-seconds: ${UPLOAD_LINK_TTL_SECONDS:600}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
