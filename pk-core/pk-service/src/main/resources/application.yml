# Cấu hình chung. Bí mật (DB, khoá JWT) lấy từ biến môi trường, KHÔNG commit giá trị thật.
spring:
  application:
    name: pk-core
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pk_core}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: ${PORT:8080}
  shutdown: graceful

app:
  ghn:
    enabled: ${GHN_ENABLED:false}
    token: ${GHN_TOKEN:}
    shop-id: ${GHN_SHOP_ID:0}
    base-url: ${GHN_BASE_URL:https://dev-online-gateway.ghn.vn}
    service-type-id: ${GHN_SERVICE_TYPE_ID:2}
    default-weight-grams: ${GHN_DEFAULT_WEIGHT_GRAMS:200}
    default-length-cm: ${GHN_DEFAULT_LENGTH_CM:20}
    default-width-cm: ${GHN_DEFAULT_WIDTH_CM:15}
    default-height-cm: ${GHN_DEFAULT_HEIGHT_CM:10}
    from-district-id: ${GHN_FROM_DISTRICT_ID:1442}
    from-ward-code: ${GHN_FROM_WARD_CODE:21211}
  payment:
    payos:
      enabled: ${PAYOS_ENABLED:false}
      client-id: ${PAYOS_CLIENT_ID:}
      api-key: ${PAYOS_API_KEY:}
      checksum-key: ${PAYOS_CHECKSUM_KEY:}
      endpoint: ${PAYOS_ENDPOINT:https://api-merchant.payos.vn/v2/payment-requests}
      return-url: ${PAYOS_RETURN_URL:http://localhost:8080/api/v1/storefront/payment/payos/return}
      cancel-url: ${PAYOS_CANCEL_URL:http://localhost:8080/api/v1/storefront/payment/payos/cancel}
      client-base-url: ${PAYOS_CLIENT_BASE_URL:http://localhost:3100}
  ai:
    enabled: ${AI_ENABLED:false}
    provider: ${AI_PROVIDER:gemini}
    api-key: ${AI_API_KEY:}
    base-url: ${AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
    model: ${AI_MODEL:gemini-3.5-flash-lite}
    assistant-model: ${AI_ASSISTANT_MODEL:gemini-3.1-pro-preview}
    current-model: ${AI_CURRENT_MODEL:gemini-3.1-pro-preview}
    assistant-thinking-level: ${AI_ASSISTANT_THINKING_LEVEL:HIGH}
    timeout: ${AI_TIMEOUT:3s}
    assistant-timeout: ${AI_ASSISTANT_TIMEOUT:60s}
    assistant-max-output-tokens: ${AI_ASSISTANT_MAX_OUTPUT_TOKENS:8192}
    assistant-retrieval-limit: ${AI_ASSISTANT_RETRIEVAL_LIMIT:8}
    chat-base-url: ${AI_CHAT_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
    temperature: ${AI_TEMPERATURE:0.2}
    prompt-cache-key: ${AI_PROMPT_CACHE_KEY:jewelry-shop-assistant}
    prompt-cache-retention: ${AI_PROMPT_CACHE_RETENTION:in_memory}
    assistant-max-tool-rounds: ${AI_ASSISTANT_MAX_TOOL_ROUNDS:1}
    assistant-context-turns: ${AI_ASSISTANT_CONTEXT_TURNS:10}
    shop-brief: ${AI_SHOP_BRIEF:Shop bán trang sức. Khách xem sản phẩm, thêm vào giỏ rồi đặt hàng. Thanh toán COD hoặc PayOS. Phí giao hàng hiện là 0 đồng. Khách đăng nhập để xem đơn. Shop không bịa thời gian đổi trả.}
    max-candidates: ${AI_MAX_CANDIDATES:24}
    min-recommendations: ${AI_MIN_RECOMMENDATIONS:3}
    max-recommendations: ${AI_MAX_RECOMMENDATIONS:6}
    min-set-items: ${AI_MIN_SET_ITEMS:2}
    max-set-items: ${AI_MAX_SET_ITEMS:6}
    history-limit: ${AI_HISTORY_LIMIT:20}
    budget-tolerance-ratio: ${AI_BUDGET_TOLERANCE_RATIO:0.10}
    max-concurrent-calls: ${AI_MAX_CONCURRENT_CALLS:2}
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:1024}
    max-input-chars: ${AI_MAX_INPUT_CHARS:6000}
    try-on-image-model: ${AI_TRYON_IMAGE_MODEL:gemini-2.5-flash-image}
    try-on-timeout: ${AI_TRYON_TIMEOUT:90s}
    try-on-max-variants: ${AI_TRYON_MAX_VARIANTS:3}
    try-on-max-upload-bytes: ${AI_TRYON_MAX_UPLOAD_BYTES:5242880}
  mirage:
    dialect: ${MIRAGE_DIALECT:postgresql}   # postgresql | h2 (test)
  jwt:
    issuer: pk-core
    access-token-minutes: 15
    refresh-token-days: 14
    # PEM (PKCS#8 private / X.509 public). Để trống => khoá tạm chỉ dùng dev. Xem README để sinh khoá.
    private-key: ${JWT_PRIVATE_KEY:}
    public-key: ${JWT_PUBLIC_KEY:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:6100,http://localhost:3100,https://jewelry-ecommerce-client.vercel.app}
  seed:
    enabled: ${SEED_ENABLED:false}
  # OTP: UI theo SĐT; không SMS. Có OTP_FORWARD_EMAIL + RESEND_API_KEY → gửi về 1 mail (Resend free).
  otp:
    fixed-code: ${OTP_FIXED_CODE:}
    forward-email: ${OTP_FORWARD_EMAIL:}
    resend-api-key: ${RESEND_API_KEY:}
    resend-from: ${OTP_RESEND_FROM:Jewelry OTP <onboarding@resend.dev>}
  upload:
    # local = disk (Render ephemeral mất file khi redeploy). cloudinary = URL res.cloudinary.com bền.
    # Profile `cloud` (application-cloud.yml) set provider=cloudinary + CLOUDINARY_* trên Render.
    provider: ${UPLOAD_PROVIDER:local}
    # Thư mục lưu file upload tạm (mặc định ổ D). public-base-url: tiền tố tuyệt đối trả cho FE, vd http://localhost:8080
    # Một thư mục gốc cho mọi file, tách folder: images/, videos/ (công khai) và private/import-export/ (CSV, KHÔNG công khai).
    # Trên cloud nên trỏ UPLOAD_DIR vào ổ bền (persistent disk); ổ tạm thì file mất khi máy dựng lại (ảnh) hoặc phải xuất lại (CSV).
    dir: ${UPLOAD_DIR:D:/pk-uploads}
    public-base-url: ${UPLOAD_PUBLIC_BASE_URL:}
    # Khoá ký link tải CSV (HMAC). Để trống = khoá ngẫu nhiên mỗi lần khởi động (link cũ hết hiệu lực khi restart). Không đặt giá trị thật vào git.
    signing-secret: ${UPLOAD_SIGNING_SECRET:}
    link-ttl-seconds: ${UPLOAD_LINK_TTL_SECONDS:600}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
