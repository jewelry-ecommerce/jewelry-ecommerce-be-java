# Cloud uses a separate database. Do not activate dev together with this profile.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:3}
      minimum-idle: 0
      connection-timeout: 30000
      idle-timeout: 60000
  flyway:
    enabled: true
    clean-disabled: true
    baseline-on-migrate: false

server:
  address: 0.0.0.0
  forward-headers-strategy: framework

app:
  seed:
    enabled: false
  upload:
    provider: cloudinary
    dir: ${UPLOAD_DIR:/tmp/jewelry-uploads}
    public-base-url: ${UPLOAD_PUBLIC_BASE_URL:${RENDER_EXTERNAL_URL:}}
    cloudinary:
      cloud-name: ${CLOUDINARY_CLOUD_NAME}
      api-key: ${CLOUDINARY_API_KEY}
      api-secret: ${CLOUDINARY_API_SECRET}
      folder: ${CLOUDINARY_FOLDER:jewelry-commerce}
  jwt:
    private-key: ${JWT_PRIVATE_KEY}
    public-key: ${JWT_PUBLIC_KEY}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
