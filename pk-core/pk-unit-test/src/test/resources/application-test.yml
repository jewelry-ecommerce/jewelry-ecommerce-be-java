# Test chạy trên H2 (chế độ PostgreSQL). Schema tạo bằng schema-test.sql (phiên bản H2 của V1);
# KHÔNG chạy Flyway (migration V1 dùng cú pháp riêng của PostgreSQL, được kiểm tra riêng - xem document/06).
spring:
  datasource:
    url: jdbc:h2:mem:pkcore;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;NON_KEYWORDS=VALUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-test.sql
  flyway:
    enabled: false
app:
  mirage:
    dialect: h2
  jwt:
    issuer: pk-core-test
  seed:
    enabled: false
  upload:
    dir: ${java.io.tmpdir}/pk-uploads-test
  otp:
    fixed-code: "123456"   # test không đọc được log nên dùng mã OTP cố định
