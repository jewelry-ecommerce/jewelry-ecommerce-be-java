name: Java CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'Run unit and integration tests (H2)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: java-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: '**/pom.xml'
      - name: Build only
        if: ${{ !inputs.run_tests }}
        working-directory: pk-core
        run: mvn -B -ntp -pl pk-service -am package -DskipTests
      - name: Build and test (isolated H2)
        if: ${{ inputs.run_tests }}
        working-directory: pk-core
        run: mvn -B -ntp verify "-Dtest=*Test,*IT" "-Dsurefire.failIfNoSpecifiedTests=false"
      - name: Upload runnable jar
        uses: actions/upload-artifact@v4
        with:
          name: jewelry-java-exec
          path: pk-core/pk-service/target/*-exec.jar
          retention-days: 3
